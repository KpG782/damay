# DAMAY — local dev mirror of prod shape.
#
# Boots api + web exactly like prod (no internal Postgres — Supabase is
# external, point SUPABASE_* at your hosted project or a `supabase start`
# local stack).
#
# Usage:
#   cp .env.example .env.local       # then fill values
#   docker compose --env-file .env.local up --build
#
# After boot:
#   web → http://localhost:3000
#   api → http://localhost:8000/healthz
#
# NB: This file is for local verification only — EasyPanel deploys directly
# from the per-service Dockerfiles per easypanel.yml.

name: damay

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: damay-api:local
    container_name: damay-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: damay-web:local
    container_name: damay-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
