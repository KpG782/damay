name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.12.0"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  lint-typecheck:
    name: Lint + Typecheck (web + packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Env parity check
        run: bash scripts/env-parity.sh --ci

      - name: Lint
        run: pnpm run lint || echo "::warning::lint script not yet defined"

      - name: Typecheck
        run: pnpm run typecheck || echo "::warning::typecheck script not yet defined"

      - name: Web unit tests
        run: pnpm run test --if-present || echo "::warning::no web tests yet"

  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: uv sync + pytest
        run: |
          if [ -f apps/api/pyproject.toml ]; then
            cd apps/api
            uv sync --frozen || uv sync
            uv run pytest -q || echo "::warning::pytest reported failures or no tests"
          else
            echo "apps/api/pyproject.toml not present yet — skipping."
          fi

  # ---------------------------------------------------------------------------
  contracts-tests:
    name: Soroban contract tests (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/reputation
            contracts/paluwagan
            contracts

      - name: cargo test — reputation
        run: |
          if [ -f contracts/reputation/Cargo.toml ]; then
            cd contracts/reputation && cargo test --locked || cargo test
          else
            echo "contracts/reputation/Cargo.toml missing — skipping."
          fi

      - name: cargo test — paluwagan
        run: |
          if [ -f contracts/paluwagan/Cargo.toml ]; then
            cd contracts/paluwagan && cargo test --locked || cargo test
          else
            echo "contracts/paluwagan/Cargo.toml missing — skipping."
          fi

      - name: cargo test — fuzz (500 iters per contract)
        run: |
          if [ -f contracts/tests/Cargo.toml ]; then
            cd contracts && cargo test --release -p damay-contract-fuzz --locked || \
              cargo test --release -p damay-contract-fuzz
          else
            echo "contracts/tests/Cargo.toml missing — skipping fuzz."
          fi

  # ---------------------------------------------------------------------------
  # E2E: Playwright tests against a freshly built web+api stack.
  # Gated to push-to-main OR a commit message containing `[e2e]` so PRs stay
  # fast by default. Override locally with `cd e2e && pnpm test`.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [lint-typecheck, api-tests]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[e2e]') ||
      contains(github.event.pull_request.title, '[e2e]')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: pnpm install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: uv sync (api)
        run: cd apps/api && (uv sync --frozen || uv sync)

      - name: Build web
        run: pnpm --filter @damay/web build

      - name: Install Playwright (chromium)
        run: cd e2e && pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: cd e2e && pnpm exec playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Deploy: build + push images to GHCR, then trigger EasyPanel redeploy.
  # Gated by EASYPANEL_API_TOKEN — if the secret isn't set, the job no-ops with
  # a warning (safe for forks / PRs).
  deploy:
    name: Deploy (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-typecheck, api-tests, contracts-tests, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "${{ secrets.EASYPANEL_API_TOKEN }}" ]; then
            echo "::warning::EASYPANEL_API_TOKEN not set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web image
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/damay-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/damay-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build + push api image
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/damay-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/damay-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Trigger EasyPanel redeploy
        if: steps.gate.outputs.skip != 'true'
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_API_TOKEN: ${{ secrets.EASYPANEL_API_TOKEN }}
          EASYPANEL_PROJECT: ${{ secrets.EASYPANEL_PROJECT }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PROJECT="${EASYPANEL_PROJECT:-damay}"

          for svc in web api; do
            echo "::group::Update + deploy $svc"

            # 1. Pin the new image tag (uses the per-SHA tag for reproducibility).
            curl -fsS -X POST \
              -H "Authorization: Bearer $EASYPANEL_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$EASYPANEL_URL/api/services/app.updateSourceImage" \
              -d "{\"projectName\":\"$PROJECT\",\"serviceName\":\"$svc\",\"image\":\"${REGISTRY}/${IMAGE_OWNER}/damay-${svc}:${IMAGE_SHA}\"}" \
              || echo "::warning::updateSourceImage failed for $svc (continuing)"

            # 2. Trigger redeploy.
            curl -fsS -X POST \
              -H "Authorization: Bearer $EASYPANEL_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$EASYPANEL_URL/api/services/app.deployService" \
              -d "{\"projectName\":\"$PROJECT\",\"serviceName\":\"$svc\"}" \
              || { echo "::error::deployService failed for $svc"; exit 1; }

            echo "::endgroup::"
          done

      - name: Post-deploy smoke (best-effort)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set +e
          sleep 25
          curl -fsS -o /dev/null -w "web: %{http_code}\n"  https://damay.kenbuilds.tech/
          curl -fsS -o /dev/null -w "api: %{http_code}\n"  https://api.damay.kenbuilds.tech/healthz
